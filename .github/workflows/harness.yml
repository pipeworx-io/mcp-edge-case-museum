name: Repro harness

# Executes every exhibit's repro on pinned runtimes and fails on any output
# that differs from its recorded expected_output (fleet #3042).
#
# The museum's one rule is that no expected_output is typed from memory. A
# contributed exhibit ("add one JSON file") is therefore EXECUTED here before
# it can merge, rather than trusted because its JSON parses.
#
# This file is GENERATED by pipeworx-core's scripts/publish-pack.sh from
# mcps/edge-case-museum/repo-workflows/harness.yml. Edit it there --
# publish-pack.sh rebuilds this repo from scratch, so local edits are erased on
# the next publish.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# `shell: bash` is load-bearing: it runs with -o pipefail. The runner's default
# (no shell given) is `bash -e` WITHOUT pipefail, so `harness | tee` would
# report tee's exit code and a red harness would read as green.
defaults:
  run:
    shell: bash

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # --no-write: CI checks, it never rewrites expected_output or verified.json.
      - name: Run every repro
        run: node src/harness.mjs --no-write 2>&1 | tee harness.log
      - name: Summary (runtimes used vs runtimes recorded)
        if: always()
        run: |
          {
            echo '### Edge Case Museum repro harness'
            echo
            echo '```'
            grep -E '^(exhibits|repros executed|runtimes|HARNESS)' harness.log || echo 'harness produced no summary (crashed before running?)'
            echo '```'
            echo
            echo '**Runtimes recorded in `verified_with` across exhibits:**'
            echo
            echo '```'
            grep -rhoE '"verified_with": "[^"]*"' src/exhibits | sort | uniq -c || true
            echo '```'
            if grep -q '^FAIL' harness.log; then
              echo
              echo '**Failures:**'
              echo
              echo '```'
              grep -A3 '^FAIL' harness.log | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
